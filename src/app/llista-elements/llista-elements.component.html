<div *ngIf="items.length > 0; else senseResultats">
  <cdk-virtual-scroll-viewport [itemSize]="altadaElement" style="height: 500px;">
    <div *cdkVirtualFor="let element of items; trackBy: trackById">
      <targeta-element [element]="element"></targeta-element>
    </div>
  </cdk-virtual-scroll-viewport>
</div>

<ng-template #senseResultats>
  <p style="color: purple; font-weight: bold; margin-top: 15px;">
  </p>
</ng-template>
